name: Moon Glass Galaxy Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and verify complete v4 project
        run: |
          set -euo pipefail
          unzip -q Moon_Glass_Galaxy_Test_Mobile_Upload.zip
          unzip -o -q Moon_Glass_v5_5_Mobile_Small_Part_1_of_5.zip
          unzip -o -q Moon_Glass_v5_5_Mobile_Small_Part_2_of_5.zip
          unzip -o -q Moon_Glass_v5_5_Mobile_Small_Part_3_of_5.zip
          unzip -o -q Moon_Glass_v5_5_Mobile_Small_Part_4_of_5.zip
          unzip -o -q Moon_Glass_v5_5_Mobile_Small_Part_5_of_5.zip
          unzip -o -q Moon_Glass_v5_5_Slack_Mapping_Addendum.zip
          python3 tools/check_assets.py
          cmp app/src/main/res/xml/appfilter.xml app/src/main/assets/appfilter.xml
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = ET.parse('app/src/main/res/xml/appfilter.xml').getroot()
          items = root.findall('item')
          components = [item.attrib['component'] for item in items]
          if len(components) != len(set(components)):
              raise SystemExit('FAIL: duplicate launcher components')
          required = {
              'com.skt.prod.dialer/com.skt.prod.dialer.activities.main.MainActivity',
              'word.office.docxviewer.document.docx.reader/word.office.docxviewer.document.docx.reader.ui.WelcomeAct',
              'com.google.android.googlequicksearchbox/com.google.android.googlequicksearchbox.SearchActivity',
              'com.sec.android.app.samsungapps/com.sec.android.app.samsungapps.SamsungAppsMainActivity',
              'com.samsung.android.oneconnect/com.samsung.android.oneconnect.ui.SCMainActivity',
          }
          observed = {component.removeprefix('ComponentInfo{').removesuffix('}') for component in components}
          missing = required - observed
          if missing:
              raise SystemExit(f'FAIL: missing required mapping(s): {sorted(missing)}')
          print(f'PASS: {len(components)} unique launcher mappings, both appfilters identical, key tested mappings retained')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Moon_Glass_Test_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
